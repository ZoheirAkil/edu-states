<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>لوحة التحكم - الأستاذ</title>
    
    <link rel="icon" type="image/png" href="image.png">
    <link rel="apple-touch-icon" href="image.png">

    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-body: #e2e8f0;
            --bg-card: #ffffff;
            --bg-input: #f1f5f9;
            --border-color: #cbd5e1;
            
            --primary: #0284c7;
            --primary-hover: #0369a1;
            
            --emerald-bg: #dcfce7;
            --emerald-text: #15803d;
            --emerald-border: #86efac;
            
            --amber-bg: #fef3c7;
            --amber-text: #b45309;
            --amber-border: #fcd34d;
            
            --indigo-bg: #e0e7ff;
            --indigo-text: #4338ca;
            --indigo-border: #a5b4fc;
            
            --danger-bg: #fee2e2;
            --danger-text: #dc2626;
            --danger-border: #fca5a5;

            --text-main: #1e293b;
            --text-sub: #475569;
            --text-muted: #64748b;
        }

        * {
            box-sizing: border-box;
            font-family: 'Tajawal', sans-serif;
            margin: 0;
            padding: 0;
            outline: none;
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            min-height: 100vh;
            background-color: var(--bg-body);
            color: var(--text-main);
            overflow-x: hidden;
            direction: rtl;
            text-align: right;
            width: 100%;
        }

        body {
            display: flex;
        }

        .dashboard-layout {
            display: flex;
            width: 100%;
            min-height: 100vh;
            max-width: 100vw;
            overflow-x: hidden;
        }

        .sidebar {
            width: 320px;
            background: #334155;
            box-shadow: -10px 0 30px rgba(0, 0, 0, 0.08);
            display: flex;
            flex-direction: column;
            padding: 40px 25px;
            position: fixed;
            height: 100vh;
            right: 0;
            top: 0;
            z-index: 50;
            overflow-y: auto;
            color: #ffffff;
            border-left: 1px solid #475569;
        }

        .main-content {
            margin-right: 320px;
            flex: 1;
            padding: 40px;
            position: relative;
            z-index: 10;
            min-height: 100vh;
            max-width: calc(100vw - 320px);
            width: calc(100vw - 320px);
            overflow-x: hidden;
        }

        .brand-header { margin-bottom: 25px; }
        .brand-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 7px 14px;
            background: rgba(255, 255, 255, 0.1);
            color: #38bdf8;
            border-radius: 999px;
            font-weight: 700;
            font-size: 12.5px;
            margin-bottom: 15px;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        .brand-header h2 { font-size: 24px; font-weight: 900; line-height: 1.4; color: #ffffff; margin-bottom: 6px; }
        .district-badge { font-size: 14px; color: #cbd5e1; font-weight: 600; margin-bottom: 12px; }

        .teacher-info-box {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 12px;
            padding: 12px 15px;
            margin-bottom: 25px;
        }
        .teacher-info-box h4 { font-size: 14px; font-weight: 800; color: #ffffff; margin-bottom: 4px; line-height: 1.4; }
        .teacher-info-box p { font-size: 12.5px; font-weight: 700; color: #38bdf8; }

        .tab-menu { display: flex; flex-direction: column; gap: 10px; margin-bottom: auto; }
        .tab-btn {
            background: transparent;
            border: none;
            padding: 14px 18px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            color: #cbd5e1;
            cursor: pointer;
            text-align: right;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 14px;
            position: relative;
            transition: all 0.25s;
            width: 100%;
        }
        .tab-btn i { font-size: 18px; width: 22px; text-align: center; }
        .tab-btn:hover { background: rgba(255, 255, 255, 0.08); color: #ffffff; transform: translateX(-4px); }
        .tab-btn.active {
            background: var(--primary);
            color: #ffffff;
            box-shadow: 0 8px 18px rgba(2, 132, 199, 0.35);
            transform: translateX(-4px);
        }

        .notification-badge {
            position: absolute; left: 15px; background-color: #ef4444; color: white;
            border-radius: 50px; padding: 2px 8px; font-size: 11px; font-weight: 900; display: none;
        }

        .sidebar-actions { margin-top: 30px; display: flex; flex-direction: column; gap: 10px; }
        .btn-logout {
            background: #dc2626;
            color: #ffffff;
            border: none;
            padding: 14px 18px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            justify-content: flex-start;
            align-items: center;
            gap: 14px;
            width: 100%;
            transition: all 0.25s;
        }
        .btn-logout i { font-size: 18px; width: 22px; text-align: center; }
        .btn-logout:hover { background: #b91c1c; transform: translateX(-4px); }

        .tab-content { display: none; animation: riseIn 0.4s ease forwards; width: 100%; }
        .tab-content.active { display: block; }

        @keyframes riseIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card {
            background: var(--bg-card);
            border-radius: 20px;
            padding: 30px;
            border: 1px solid var(--border-color);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.04);
            margin-bottom: 25px;
            width: 100%;
            max-width: 100%;
        }

        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 22px;
            padding-bottom: 12px;
            border-bottom: 2px solid var(--border-color);
            gap: 12px;
        }
        .card h3 { font-size: 18px; font-weight: 800; color: var(--text-main); display: flex; align-items: center; gap: 10px; }

        .status-banner {
            padding: 15px 20px;
            border-radius: 12px;
            margin-bottom: 22px;
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 800;
            font-size: 14px;
        }
        .status-pending { background: #fef3c7; color: #b45309; border: 1px solid #fde68a; }
        .status-approved { background: #dcfce7; color: #15803d; border: 1px solid #86efac; }
        .status-rejected { background: #fee2e2; color: #dc2626; border: 1px solid #fca5a5; }

        .grid-forms { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 18px; }

        .form-group { margin-bottom: 18px; position: relative; width: 100%; text-align: right; }
        .form-group label { display: block; font-size: 13px; font-weight: 700; color: var(--text-sub); margin-bottom: 8px; transition: color 0.2s; text-align: right; }
        .form-group:focus-within label { color: var(--primary); }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1.5px solid var(--border-color);
            border-radius: 12px;
            background: var(--bg-input);
            font-size: 14px;
            color: var(--text-main);
            font-weight: 700;
            text-align: right;
            transition: all 0.25s;
        }
        .form-group input:disabled {
            background-color: #e2e8f0; cursor: not-allowed; opacity: 0.7; border-color: #cbd5e1;
        }
        .form-group input:focus:not(:disabled) { border-color: var(--primary); background: #ffffff; box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15); }
        .form-group input::placeholder { color: var(--text-muted); font-weight: 500; font-size: 13px; }

        .input-container { position: relative; width: 100%; }

        .form-group select, .input-container select { display: none !important; }

        .custom-select-ui {
            width: 100%;
            padding: 12px 16px;
            border: 1.5px solid var(--border-color);
            border-radius: 12px;
            background: var(--bg-input);
            font-size: 14px;
            color: var(--text-main);
            font-weight: 700;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.25s;
        }

        .custom-select-ui::after {
            content: '\f107';
            font-family: 'Font Awesome 6 Free';
            font-weight: 900;
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 13px;
            transition: transform 0.3s ease, color 0.3s ease;
        }

        .custom-select-ui.active { border-color: var(--primary); background: #ffffff; box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15); }
        .custom-select-ui.active::after { color: var(--primary); transform: translateY(-50%) rotate(180deg); }

        .input-container.disabled .custom-select-ui { background: #e2e8f0; color: #94a3b8; cursor: not-allowed; border-color: #cbd5e1; }
        .input-container.disabled .custom-select-ui::after { color: #94a3b8; }

        .custom-options-list {
            position: absolute;
            top: calc(100% + 6px);
            left: 0;
            right: 0;
            background: #ffffff;
            border: 1.5px solid var(--border-color);
            border-radius: 12px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.08);
            z-index: 9999;
            max-height: 220px;
            overflow-y: auto;
            opacity: 0;
            visibility: hidden;
            transform: translateY(8px);
            transition: all 0.2s ease;
        }

        .custom-options-list.show { opacity: 1; visibility: visible; transform: translateY(0); }

        .custom-option {
            padding: 11px 16px;
            font-size: 13.5px;
            font-weight: 600;
            color: var(--text-main);
            cursor: pointer;
            transition: background 0.2s ease, color 0.2s ease;
        }

        .custom-option:not(.disabled):hover { background: #e0f2fe; color: var(--primary); }
        .custom-option.disabled { color: #94a3b8; cursor: not-allowed; background: transparent; }

        .custom-options-list::-webkit-scrollbar { width: 5px; }
        .custom-options-list::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 10px; }

        .form-group:has(.custom-select-ui.active), .input-container:has(.custom-select-ui.active) { z-index: 50; }

        .btn {
            border: none;
            padding: 12px 18px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            transition: all 0.25s;
            position: relative;
            z-index: 10;
        }
        .btn:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 6px 15px rgba(0,0,0,0.08); }
        .btn:active { transform: scale(0.98); }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; box-shadow: none; }
        .btn-submit, .btn { background: var(--primary); color: #fff; }
        .btn-secondary { background: #64748b; color: #fff; }
        .btn-danger { background: #dc2626; color: #fff; }
        .btn-sm { padding: 8px 14px; font-size: 12.5px; border-radius: 8px; }

        .chat-box {
            border: 1.5px solid var(--border-color);
            border-radius: 14px;
            padding: 16px;
            height: 320px;
            overflow-y: auto;
            background-color: var(--bg-input);
            margin-bottom: 18px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            direction: rtl;
        }
        .chat-message { padding: 12px 16px; border-radius: 14px; max-width: 75%; font-size: 14px; font-weight: 600; line-height: 1.5; text-align: right; box-shadow: 0 2px 5px rgba(0,0,0,0.04); }
        .chat-message.sent { background-color: var(--primary); color: white; align-self: flex-start; border-top-right-radius: 4px; }
        .chat-message.received { background-color: #ffffff; color: var(--text-main); align-self: flex-end; border-top-left-radius: 4px; border: 1px solid var(--border-color); }

        .custom-modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px);
            display: flex; justify-content: center; align-items: center; z-index: 1000;
            opacity: 0; visibility: hidden; transition: all 0.25s;
            direction: rtl;
        }
        .custom-modal-overlay.active { opacity: 1; visibility: visible; }
        .custom-modal {
            background: #ffffff; padding: 32px; border-radius: 20px; width: 100%; max-width: 400px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15); text-align: right; transform: translateY(15px); transition: all 0.25s;
            border: 1px solid var(--border-color);
        }
        .custom-modal-overlay.active .custom-modal { transform: translateY(0); }
        .custom-modal h4 { color: var(--text-main); font-size: 19px; font-weight: 900; margin-bottom: 10px; }
        .custom-modal p { color: var(--text-sub); font-size: 14px; font-weight: 500; margin-bottom: 22px; line-height: 1.6; }
        .custom-modal-actions { display: flex; justify-content: flex-end; gap: 10px; }
        .custom-modal-actions .btn { flex: 1; }

        .pulse-overlay {
            position: fixed;
            inset: 0;
            background: rgba(226, 232, 240, 0.85);
            backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .pulse-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .drop-pulse-wrapper {
            position: relative;
            width: 80px;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .drop-pulse-ring {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: var(--primary);
            opacity: 0.25;
            animation: ripple 1.6s cubic-bezier(0, 0.2, 0.8, 1) infinite;
        }

        .drop-pulse-ring:nth-child(2) {
            animation-delay: 0.5s;
        }

        .drop-icon-center {
            width: 48px;
            height: 48px;
            background: #ffffff;
            border: 2px solid var(--primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2;
            box-shadow: 0 0 20px rgba(2, 132, 199, 0.2);
        }

        .drop-icon-center i {
            font-size: 20px;
            color: var(--primary);
        }

        @keyframes ripple {
            0% { transform: scale(0.6); opacity: 0.6; }
            100% { transform: scale(1.7); opacity: 0; }
        }

        .pulse-text {
            margin-top: 18px;
            font-size: 14px;
            font-weight: 700;
            color: var(--text-main);
        }

        .bottom-nav {
            display: none;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-top: 1px solid var(--border-color);
            padding: 8px 12px;
            z-index: 90;
            justify-content: space-around;
            align-items: center;
            box-shadow: 0 -4px 15px rgba(0, 0, 0, 0.06);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: var(--text-sub);
            text-decoration: none;
            font-size: 11px;
            font-weight: 700;
            transition: color 0.2s ease, transform 0.2s ease;
            cursor: pointer;
        }

        .nav-item.active, .nav-item:hover {
            color: var(--primary);
            transform: translateY(-2px);
        }

        .nav-item i {
            font-size: 16px;
        }

        @media (max-width: 1024px) {
            .dashboard-layout { flex-direction: column; padding-bottom: 74px; width: 100vw; overflow-x: hidden; }
            .sidebar { display: none; }
            .main-content { margin-right: 0; padding: 14px 10px; max-width: 100vw; width: 100vw; overflow-x: hidden; }
            .card { padding: 16px 12px; border-radius: 16px; margin-bottom: 16px; width: 100%; }
            .bottom-nav { display: flex; }
            .grid-forms { grid-template-columns: 1fr; gap: 16px; }
            
            .card-header {
                flex-direction: column;
                align-items: stretch;
                gap: 12px;
            }
        }

        @media print {
            body { background: white !important; color: black !important; display: block !important; }
            .sidebar, .tab-menu, .btn, .bottom-nav, .pulse-overlay, .custom-modal-overlay { display: none !important; }
            .main-content { margin: 0 !important; padding: 0 !important; width: 100% !important; }
            .card { border: none !important; box-shadow: none !important; background: transparent !important; padding: 0 !important; margin: 0 !important; }
        }
    </style>
</head>
<body oncontextmenu="return false;">

    <div class="pulse-overlay" id="loadingPulse">
        <div class="drop-pulse-wrapper">
            <div class="drop-pulse-ring"></div>
            <div class="drop-pulse-ring"></div>
            <div class="drop-icon-center">
                <i class="fa-solid fa-chalkboard-user"></i>
            </div>
        </div>
        <div class="pulse-text" id="pulseStatusText">جاري تحديث البيانات...</div>
    </div>

    <div id="customModal" class="custom-modal-overlay">
        <div class="custom-modal">
            <h4 id="modalTitle">تأكيد الإجراء</h4>
            <p id="modalMessage">هل أنت متأكد من تنفيذ هذا الإجراء؟</p>
            <div class="custom-modal-actions">
                <button id="modalConfirmBtn" class="btn btn-danger">تأكيد</button>
                <button onclick="closeModal()" class="btn btn-secondary">إلغاء</button>
            </div>
        </div>
    </div>

    <div class="dashboard-layout">
        <aside class="sidebar">
            <div class="brand-header">
                <div class="brand-badge">
                    <i class="fa-solid fa-chalkboard-user"></i>
                    حساب الأستاذ
                </div>
                <h2>لوحة التحكم</h2>
                <div class="district-badge" id="districtBadgeTitle">جاري التحميل...</div>
                <div class="teacher-info-box">
                    <h4 id="schoolTitle">المدرسة: جاري التحميل...</h4>
                    <p id="teacherTitle"></p>
                </div>
            </div>

            <div class="tab-menu">
                <button class="tab-btn active" onclick="switchTab('profileTab', this)">
                    <i class="fa-solid fa-address-card"></i> بياناتي الإدارية
                </button>
                <button class="tab-btn" onclick="switchTab('chatTab', this)">
                    <i class="fa-solid fa-envelope-open-text"></i> مراسلة المدير
                    <span id="chatNotificationBadge" class="notification-badge">0</span>
                </button>
            </div>

            <div class="sidebar-actions">
                <button class="btn-logout" onclick="logout()">
                    <i class="fa-solid fa-right-from-bracket"></i> تسجيل الخروج
                </button>
            </div>
        </aside>

        <main class="main-content">
            <div class="floating-shape shape-a"></div>
            <div class="floating-shape shape-b"></div>

            <div id="profileTab" class="tab-content active">
                <div class="card">
                    <div class="card-header">
                        <h3><i class="fa-solid fa-pen-to-square"></i> إدخال وتحديث البيانات الإدارية</h3>
                    </div>

                    <div id="statusBanner" class="status-banner" style="display: none;">
                        <i id="statusIcon" class="fa-solid fa-circle-info fa-lg"></i>
                        <span id="statusText">جاري فحص حالة البيانات...</span>
                    </div>

                    <form onsubmit="confirmSubmitProfile(event)">
                        <div class="grid-forms">
                            <div class="form-group">
                                <label>الاسم واللقب الكامل</label>
                                <input type="text" id="fullName" placeholder="أدخل الاسم واللقب" required oninvalid="this.setCustomValidity('يرجى ملء الاسم واللقب الكامل')" oninput="this.setCustomValidity('')">
                            </div>
                            <div class="form-group">
                                <label>اللقب الأصلي للزوجة</label>
                                <input type="text" id="maidenName" placeholder="اللقب الأصلي إن وجد">
                            </div>
                            <div class="form-group">
                                <label>تاريخ ومكان الميلاد</label>
                                <input type="text" id="birthInfo" placeholder="مثال: 09 أوت 1994 بوهران">
                            </div>
                            <div class="form-group">
                                <label>الإطار</label>
                                <div class="input-container">
                                    <select id="framework" onchange="autoSelectCategory()" required oninvalid="this.setCustomValidity('يرجى اختيار الإطار')" oninput="this.setCustomValidity('')">
                                        <option value="">-- اختر الإطار --</option>
                                        <option value="أستاذ التعليم الابتدائي">أستاذ التعليم الابتدائي</option>
                                        <option value="أستاذ التعليم الابتدائي قسم أول">أستاذ التعليم الابتدائي قسم أول</option>
                                        <option value="أستاذ التعليم الابتدائي قسم ثان">أستاذ التعليم الابتدائي قسم ثان</option>
                                        <option value="أستاذ مميز">أستاذ مميز</option>
                                    </select>
                                </div>
                            </div>
                            <div class="form-group">
                                <label>الصنف (تلقائي)</label>
                                <div class="input-container">
                                    <select id="category" required disabled>
                                        <option value="">-- يحدد تلقائياً --</option>
                                        <option value="12">12</option>
                                        <option value="13">13</option>
                                        <option value="14">14</option>
                                        <option value="15">15</option>
                                    </select>
                                </div>
                            </div>
                            <div class="form-group">
                                <label>الدرجة الحالية</label>
                                <div class="input-container">
                                    <select id="grade" required oninvalid="this.setCustomValidity('يرجى اختيار الدرجة')" oninput="this.setCustomValidity('')">
                                        <option value="">-- اختر الدرجة --</option>
                                        <option value="0">0</option>
                                        <option value="1">1</option>
                                        <option value="2">2</option>
                                        <option value="3">3</option>
                                        <option value="4">4</option>
                                        <option value="5">5</option>
                                        <option value="6">6</option>
                                        <option value="7">7</option>
                                        <option value="8">8</option>
                                        <option value="9">9</option>
                                        <option value="10">10</option>
                                        <option value="11">11</option>
                                        <option value="12">12</option>
                                    </select>
                                </div>
                            </div>
                            <div class="form-group">
                                <label>تاريخ السريان</label>
                                <input type="date" id="effectiveDate">
                            </div>
                            <div class="form-group">
                                <label>نقطة التفتيش</label>
                                <input type="number" id="inspectionScore" step="0.25" min="0" max="20" placeholder="مثال: 15.5">
                            </div>
                            <div class="form-group">
                                <label>تاريخ آخر تفتيش</label>
                                <input type="date" id="lastInspectionDate">
                            </div>
                            <div class="form-group">
                                <label>تاريخ آخر زيارة توجيهية</label>
                                <input type="date" id="lastGuidanceVisitDate">
                            </div>
                            <div class="form-group">
                                <label>تاريخ أول تعيين</label>
                                <input type="date" id="firstAppointmentDate">
                            </div>
                            <div class="form-group">
                                <label>تاريخ التثبيت</label>
                                <input type="date" id="confirmationDate">
                            </div>
                            <div class="form-group">
                                <label>الشهادة والمؤهل العلمي</label>
                                <input type="text" id="degreeSubject" placeholder="مثال: ليسانس لغة عربية">
                            </div>
                            <div class="form-group">
                                <label>القسم المسند حالياً</label>
                                <div class="input-container">
                                    <select id="assignedClass" required oninvalid="this.setCustomValidity('يرجى اختيار القسم المسند')" oninput="this.setCustomValidity('')">
                                        <option value="">-- اختر القسم --</option>
                                        <option value="التحضيري">التحضيري</option>
                                        <option value="السنة الأولى">السنة الأولى</option>
                                        <option value="السنة الثانية">السنة الثانية</option>
                                        <option value="السنة الثالثة">السنة الثالثة</option>
                                        <option value="السنة الرابعة">السنة الرابعة</option>
                                        <option value="السنة الخامسة">السنة الخامسة</option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <div style="margin-top: 25px;">
                            <button type="submit" id="saveBtn" class="btn btn-submit">
                                <i class="fa-solid fa-paper-plane"></i> إرسال البيانات للمراجعة
                            </button>
                        </div>
                    </form>
                </div>
            </div>

            <div id="chatTab" class="tab-content">
                <div class="card">
                    <div class="card-header">
                        <h3><i class="fa-solid fa-comments"></i> مراسلة مدير المدرسة</h3>
                        <div style="display: flex; gap: 8px;">
                            <button class="btn btn-secondary btn-sm" onclick="loadTeacherChat()"><i class="fa-solid fa-rotate-right"></i> تحديث</button>
                        </div>
                    </div>
                    
                    <div class="chat-box" id="teacherChatBox">
                        <div style="text-align: center; color: var(--text-muted); margin-top: 100px; font-weight: 700;">لا توجد رسائل سابقة.</div>
                    </div>

                    <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                        <div class="form-group" style="flex: 1; min-width: 200px; margin: 0;">
                            <input type="text" id="teacherChatMessage" placeholder="اكتب رسالتك لمدير المدرسة...">
                        </div>
                        <button class="btn btn-submit" style="width: auto;" onclick="sendTeacherMessage()">
                            <i class="fa-solid fa-paper-plane"></i> إرسال
                        </button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <nav class="bottom-nav">
        <div class="nav-item active" onclick="switchMobileTab('profileTab', this)">
            <i class="fa-solid fa-address-card"></i>
            <span>بياناتي</span>
        </div>
        <div class="nav-item" onclick="switchMobileTab('chatTab', this)">
            <i class="fa-solid fa-envelope-open-text"></i>
            <span>الرسائل</span>
        </div>
        <div class="nav-item" onclick="logout()">
            <i class="fa-solid fa-right-from-bracket"></i>
            <span>خروج</span>
        </div>
    </nav>

<script>
    const SCRIPT_URL = localStorage.getItem("currentScriptUrl");
    const currentDistrictName = localStorage.getItem("currentDistrictName");

    if (!SCRIPT_URL) {
        window.location.href = "index.html";
    }

    let currentUsername = "";
    let directorUsername = "";

    const loadingPulse = document.getElementById('loadingPulse');
    const pulseStatusText = document.getElementById('pulseStatusText');

    function showLoader(text = "جاري تحديث البيانات...") {
        if (!loadingPulse) return;
        pulseStatusText.textContent = text;
        loadingPulse.classList.add('active');
    }

    function hideLoader() {
        if (!loadingPulse) return;
        loadingPulse.classList.remove('active');
    }

    const categoryMapping = {
        "أستاذ التعليم الابتدائي": "12",
        "أستاذ التعليم الابتدائي قسم أول": "13",
        "أستاذ التعليم الابتدائي قسم ثان": "14",
        "أستاذ مميز": "15"
    };

    function autoSelectCategory() {
        const frameworkVal = document.getElementById("framework").value;
        document.getElementById("category").value = categoryMapping[frameworkVal] || "";
        document.getElementById("category").dispatchEvent(new Event('change'));
    }

    function switchTab(tabId, btn) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        btn.classList.add('active');

        if (tabId === 'chatTab') {
            loadTeacherChat();
        }
    }

    function switchMobileTab(tabId, el) {
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        document.querySelectorAll('.bottom-nav .nav-item').forEach(i => i.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        el.classList.add('active');
        window.scrollTo({ top: 0, behavior: 'smooth' });

        if (tabId === 'chatTab') {
            loadTeacherChat();
        }
    }

    function showModal(title, message, confirmCallback, btnClass = 'btn-danger') {
        const modal = document.getElementById("customModal");
        document.getElementById("modalTitle").textContent = title;
        document.getElementById("modalMessage").textContent = message;
        
        const confirmBtn = document.getElementById("modalConfirmBtn");
        confirmBtn.className = `btn ${btnClass}`;
        confirmBtn.textContent = 'تأكيد';
        
        const newBtn = confirmBtn.cloneNode(true);
        confirmBtn.parentNode.replaceChild(newBtn, confirmBtn);
        
        newBtn.onclick = function() {
            closeModal();
            confirmCallback();
        };

        modal.classList.add("active");
    }

    function closeModal() {
        document.getElementById("customModal").classList.remove("active");
    }

    function formatDateInput(rawDate) {
        if (!rawDate || rawDate === '-') return '';
        const d = new Date(rawDate);
        if (isNaN(d.getTime())) return '';
        return `${d.getUTCFullYear()}-${String(d.getUTCMonth() + 1).padStart(2, '0')}-${String(d.getUTCDate()).padStart(2, '0')}`;
    }

    window.onload = function() {
        const session = JSON.parse(localStorage.getItem("userSession"));
        if (!session || session.role !== "teacher") {
            window.location.href = "login.html";
        } else {
            currentUsername = session.username;
            document.getElementById("teacherTitle").innerHTML = "<i class='fa-solid fa-user'></i> الأستاذ: " + currentUsername;
            
            if (currentDistrictName) {
                document.getElementById("districtBadgeTitle").textContent = currentDistrictName;
            }

            loadTeacherProfile();
            setInterval(checkNewMessages, 10000);
        }
    };

    async function loadTeacherProfile() {
        showLoader("جاري جلب بياناتك الإدارية...");
        try {
            const response = await fetch(SCRIPT_URL, {
                method: 'POST',
                body: JSON.stringify({ action: "getTeacherProfile", username: currentUsername })
            });
            const result = await response.json();

            if (result.status === "success" && result.data) {
                const t = result.data;
                document.getElementById("schoolTitle").innerHTML = "<i class='fa-solid fa-school'></i> المدرسة: " + (t.schoolName || "غير مسند");
                directorUsername = t.schoolDirectorUsername || "";

                document.getElementById("fullName").value = t.fullName || "";
                document.getElementById("maidenName").value = t.maidenName || "";
                document.getElementById("birthInfo").value = t.birthInfo || "";
                document.getElementById("framework").value = t.framework || "";
                document.getElementById("framework").dispatchEvent(new Event('change'));
                autoSelectCategory();
                document.getElementById("grade").value = t.grade || "";
                document.getElementById("grade").dispatchEvent(new Event('change'));
                document.getElementById("effectiveDate").value = formatDateInput(t.effectiveDate);
                document.getElementById("inspectionScore").value = t.inspectionScore || "";
                document.getElementById("lastInspectionDate").value = formatDateInput(t.lastInspectionDate);
                document.getElementById("lastGuidanceVisitDate").value = formatDateInput(t.lastGuidanceVisitDate);
                document.getElementById("firstAppointmentDate").value = formatDateInput(t.firstAppointmentDate);
                document.getElementById("confirmationDate").value = formatDateInput(t.confirmationDate);
                document.getElementById("degreeSubject").value = t.degreeSubject || "";
                document.getElementById("assignedClass").value = t.assignedClass || "";
                document.getElementById("assignedClass").dispatchEvent(new Event('change'));

                const status = t.status || "new";
                if (status === "pending") {
                    updateStatusBanner("status-pending", "fa-clock-rotate-left", "بياناتك قيد المراجعة حالياً من طرف مدير المدرسة.");
                } else if (status === "approved") {
                    updateStatusBanner("status-approved", "fa-circle-check", "تم اعتماد بياناتك رسمياً من طرف الإدارة.");
                } else if (status === "rejected") {
                    updateStatusBanner("status-rejected", "fa-circle-exclamation", "تم رفض البيانات من المدير، يرجى التعديل وإعادة الإرسال.");
                } else {
                    updateStatusBanner("none", "", "");
                }
                initCustomSelects();
            }
        } catch (error) {
        } finally {
            hideLoader();
        }
    }

    function updateStatusBanner(className, iconClass, text) {
        const banner = document.getElementById("statusBanner");
        if (className === "none") {
            banner.style.display = "none";
            return;
        }
        banner.style.display = "flex";
        banner.className = "status-banner " + className;
        document.getElementById("statusIcon").className = "fa-solid " + iconClass + " fa-lg";
        document.getElementById("statusText").textContent = text;
    }

    function confirmSubmitProfile(e) {
        e.preventDefault();
        showModal("إرسال البيانات", "هل أنت متأكد من إرسال هذه البيانات إلى مدير المدرسة للمراجعة والاعتماد؟", function() {
            executeSubmitProfile();
        }, "btn-submit");
    }

    async function executeSubmitProfile() {
        const data = {
            action: "submitTeacherProfile",
            username: currentUsername,
            fullName: document.getElementById("fullName").value.trim(),
            maidenName: document.getElementById("maidenName").value.trim(),
            birthInfo: document.getElementById("birthInfo").value.trim(),
            framework: document.getElementById("framework").value,
            category: document.getElementById("category").value,
            grade: document.getElementById("grade").value,
            effectiveDate: document.getElementById("effectiveDate").value,
            inspectionScore: document.getElementById("inspectionScore").value.trim(),
            lastInspectionDate: document.getElementById("lastInspectionDate").value,
            lastGuidanceVisitDate: document.getElementById("lastGuidanceVisitDate").value,
            firstAppointmentDate: document.getElementById("firstAppointmentDate").value,
            confirmationDate: document.getElementById("confirmationDate").value,
            degreeSubject: document.getElementById("degreeSubject").value.trim(),
            assignedClass: document.getElementById("assignedClass").value
        };

        showLoader("جاري إرسال البيانات...");
        try {
            const response = await fetch(SCRIPT_URL, {
                method: 'POST',
                body: JSON.stringify(data)
            });
            const result = await response.json();

            if (result.status === "success") {
                loadTeacherProfile();
            }
        } catch (error) {
        } finally {
            hideLoader();
        }
    }

    async function loadTeacherChat() {
        if (!directorUsername) return;
        const chatBox = document.getElementById("teacherChatBox");

        showLoader("جاري جلب الرسائل...");
        try {
            const response = await fetch(SCRIPT_URL, {
                method: 'POST',
                body: JSON.stringify({ action: "getMessages", user1: currentUsername, user2: directorUsername })
            });
            const result = await response.json();
            
            if (result.status === "success") {
                const messages = result.messages || [];
                if (messages.length === 0) {
                    chatBox.innerHTML = '<div style="text-align: center; color: var(--text-muted); margin-top: 100px; font-weight: 700;">لا توجد رسائل سابقة.</div>';
                } else {
                    chatBox.innerHTML = messages.map(m => `
                        <div class="chat-message ${m.sender === currentUsername ? 'sent' : 'received'}">
                            <div>${m.text}</div>
                        </div>
                    `).join("");
                    chatBox.scrollTop = chatBox.scrollHeight;
                }
            }
        } catch (e) {
        } finally {
            hideLoader();
        }
    }

    async function sendTeacherMessage() {
        if (!directorUsername) return;
        const msgInput = document.getElementById("teacherChatMessage");
        const text = msgInput.value.trim();
        if (!text) return;

        showLoader("جاري إرسال الرسالة...");
        try {
            const response = await fetch(SCRIPT_URL, {
                method: 'POST',
                body: JSON.stringify({ action: "sendMessage", sender: currentUsername, receiver: directorUsername, message: text })
            });
            const result = await response.json();
            if (result.status === "success") {
                msgInput.value = "";
                loadTeacherChat();
            }
        } catch (e) {
        } finally {
            hideLoader();
        }
    }

    async function checkNewMessages() {
        if (!directorUsername) return;
        try {
            const response = await fetch(SCRIPT_URL, {
                method: 'POST',
                body: JSON.stringify({ action: "getMessages", user1: currentUsername, user2: directorUsername })
            });
            const result = await response.json();
            if (result.status === "success" && result.messages) {
                const count = result.messages.length;
                const badge = document.getElementById("chatNotificationBadge");
                if (badge) {
                    if (count > 0) {
                        badge.textContent = count;
                        badge.style.display = "inline-block";
                    } else {
                        badge.style.display = "none";
                    }
                }
            }
        } catch (e) {}
    }

    function logout() {
        localStorage.removeItem("userSession");
        window.location.href = "index.html";
    }
</script>

<script>
    function initCustomSelects() {
        const containers = document.querySelectorAll('.input-container');

        containers.forEach(container => {
            const select = container.querySelector('select');
            if (!select) return;

            let customSelect = container.querySelector('.custom-select-ui');
            let optionsList = container.querySelector('.custom-options-list');

            if (!customSelect) {
                customSelect = document.createElement('div');
                customSelect.className = 'custom-select-ui';
                container.appendChild(customSelect);
            }

            if (!optionsList) {
                optionsList = document.createElement('div');
                optionsList.className = 'custom-options-list';
                container.appendChild(optionsList);
            }

            let selectedText = customSelect.querySelector('span');
            if (!selectedText) {
                selectedText = document.createElement('span');
                customSelect.appendChild(selectedText);
            }

            const renderOptions = () => {
                optionsList.innerHTML = '';
                Array.from(select.options).forEach((option, index) => {
                    const optDiv = document.createElement('div');
                    optDiv.className = 'custom-option';
                    if (option.disabled || option.value === "") optDiv.classList.add('disabled');
                    optDiv.textContent = option.text;
                    
                    optDiv.addEventListener('click', (e) => {
                        e.stopPropagation();
                        if (option.disabled || option.value === "") return;
                        
                        select.selectedIndex = index;
                        selectedText.textContent = option.text;
                        optionsList.classList.remove('show');
                        customSelect.classList.remove('active');
                        
                        document.querySelectorAll('.form-group, .input-container, td').forEach(g => {
                            if(g.style.zIndex === '999') g.style.zIndex = '';
                        });
                        
                        select.dispatchEvent(new Event('change'));
                    });
                    optionsList.appendChild(optDiv);
                });
                selectedText.textContent = select.options[select.selectedIndex]?.text || '';
            };

            renderOptions();
            if (select.disabled) container.classList.add('disabled');
            else container.classList.remove('disabled');

            if (!select._hasCustomObserver) {
                const observer = new MutationObserver(() => {
                    renderOptions();
                    if (select.disabled) {
                        container.classList.add('disabled');
                    } else {
                        container.classList.remove('disabled');
                    }
                });
                observer.observe(select, { childList: true, attributes: true, attributeFilter: ['disabled'] });
                select._hasCustomObserver = true;
            }

            if (!customSelect._hasClickListener) {
                customSelect.addEventListener('click', (e) => {
                    e.stopPropagation();
                    if (select.disabled) return;
                    
                    const isOpen = optionsList.classList.contains('show');
                    
                    document.querySelectorAll('.custom-options-list').forEach(l => l.classList.remove('show'));
                    document.querySelectorAll('.custom-select-ui').forEach(c => c.classList.remove('active'));
                    document.querySelectorAll('.form-group, .input-container, td').forEach(g => {
                        if(g.style.zIndex === '999') g.style.zIndex = '';
                    });
                    
                    if (!isOpen) {
                        optionsList.classList.add('show');
                        customSelect.classList.add('active');
                        const group = container.closest('.form-group') || container;
                        group.style.zIndex = '999';
                    }
                });
                customSelect._hasClickListener = true;
            }

            select.addEventListener('change', () => {
                selectedText.textContent = select.options[select.selectedIndex]?.text || '';
            });
        });
    }

    document.addEventListener("DOMContentLoaded", () => {
        initCustomSelects();
    });

    document.addEventListener('click', () => {
        document.querySelectorAll('.custom-options-list').forEach(l => l.classList.remove('show'));
        document.querySelectorAll('.custom-select-ui').forEach(c => c.classList.remove('active'));
        document.querySelectorAll('.form-group, .input-container, td').forEach(g => {
            if(g.style.zIndex === '999') g.style.zIndex = '';
        });
    });
</script>
</body>
</html>
