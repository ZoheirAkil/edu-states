<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - النظام الرقمي لمتابعة الوضعية الإدارية للأساتذة</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --ink: #12172b;
            --muted: #6b7280;
            --line: #e6e8f0;
            --card: #ffffff;
            --accent: #3862f2;
            --accent-soft: #eaefff;
            --accent-dark: #2b4fd6;
            --panel-1: #1c2a6b;
            --panel-2: #0d1338;
        }

        * {
            box-sizing: border-box;
            font-family: 'Tajawal', sans-serif;
            margin: 0;
            padding: 0;
        }

        html, body { min-height: 100vh; }

        body {
            display: flex;
            background: var(--card);
            color: var(--ink);
            overflow-x: hidden;
        }

        .split-layout {
            display: flex;
            width: 100%;
            min-height: 100vh;
        }

        /* ---------- FORM SIDE ---------- */

        .form-side {
            width: 45%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 6% 9%;
        }

        .form-inner {
            width: 100%;
            max-width: 400px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--accent-soft);
            color: var(--accent);
            font-size: 12.5px;
            font-weight: 700;
            padding: 7px 14px;
            border-radius: 999px;
            margin-bottom: 20px;
            opacity: 0;
            animation: riseIn 0.6s ease-out forwards;
        }

        .badge i { font-size: 11px; }

        .brand-header { margin-bottom: 30px; }

        .brand-header h2 {
            font-size: 23px;
            font-weight: 900;
            line-height: 1.5;
            opacity: 0;
            animation: riseIn 0.6s 0.05s ease-out forwards;
        }

        #loginForm {
            display: flex;
            flex-direction: column;
            opacity: 0;
            animation: riseIn 0.6s 0.1s ease-out forwards;
        }

        .form-group { margin-bottom: 22px; }

        .form-group label {
            display: block;
            font-size: 13.5px;
            font-weight: 700;
            color: var(--muted);
            margin-bottom: 9px;
            transition: color 0.3s ease;
        }

        .form-group:focus-within label { color: var(--accent); }

        .input-container {
            position: relative;
            border: 1.5px solid var(--line);
            border-radius: 12px;
            background: var(--card);
            transition: border-color 0.25s ease, box-shadow 0.25s ease;
        }

        .form-group:focus-within .input-container {
            border-color: var(--accent);
            box-shadow: 0 0 0 4px var(--accent-soft);
        }

        .input-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--muted);
            font-size: 14px;
            pointer-events: none;
            transition: color 0.3s ease;
        }

        .form-group:focus-within .input-icon { color: var(--accent); }

        .form-group input {
            width: 100%;
            padding: 14px 16px 14px 40px;
            border: none;
            background: transparent;
            font-size: 15px;
            font-weight: 700;
            color: var(--ink);
            outline: none;
        }

        .form-group input::placeholder { color: #a7abb8; font-weight: 500; }

        .btn-submit {
            width: 100%;
            background: var(--accent);
            color: #ffffff;
            border: none;
            padding: 16px 20px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 6px;
            transition: background 0.25s ease, transform 0.2s ease, box-shadow 0.25s ease;
        }

        .btn-submit i { transition: transform 0.3s ease; }

        .btn-submit:hover:not(:disabled) {
            background: var(--accent-dark);
            transform: translateY(-2px);
            box-shadow: 0 14px 26px -10px rgba(56, 98, 242, 0.5);
        }

        .btn-submit:hover:not(:disabled) i { transform: translateX(-5px); }

        .btn-submit:disabled { background: #e5e7f0; color: #a7abb8; cursor: not-allowed; }

        .btn-back {
            width: 100%;
            background: transparent;
            color: var(--muted);
            border: 1.5px solid var(--line);
            padding: 14px;
            border-radius: 12px;
            font-size: 14.5px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-top: 12px;
            transition: background 0.25s ease, color 0.25s ease, border-color 0.25s ease;
        }

        .btn-back:hover {
            background: var(--accent-soft);
            color: var(--accent);
            border-color: var(--accent-soft);
        }

        .contact-footer {
            margin-top: auto;
            padding-top: 30px;
            font-size: 12.5px;
            color: var(--muted);
            font-weight: 600;
            text-align: center;
            opacity: 0;
            animation: fadeIn 1s 0.3s ease-out forwards;
        }

        /* ---------- PRESENTATION SIDE ---------- */

        .presentation-side {
            width: 55%;
            position: relative;
            background: linear-gradient(155deg, var(--panel-1), var(--panel-2));
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            padding: 40px;
        }

        .presentation-side::before {
            content: '';
            position: absolute;
            width: 620px;
            height: 620px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,255,255,0.06), transparent 70%);
            top: -120px;
            right: -160px;
        }

        .orbit-wrap {
            position: relative;
            width: 280px;
            height: 280px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 40px;
        }

        .orbit-track {
            position: absolute;
            inset: 0;
            border: 1px dashed rgba(255,255,255,0.16);
            border-radius: 50%;
        }

        .orbit-ring {
            position: absolute;
            inset: 0;
            animation: spin 30s linear infinite;
        }

        .satellite {
            position: absolute;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.18);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-size: 16px;
            backdrop-filter: blur(4px);
        }

        .satellite.s1 { top: -25px; left: calc(50% - 25px); animation: counterSpin 30s linear infinite; }
        .satellite.s2 { bottom: 22px; left: 4px; animation: counterSpin 30s linear infinite; }
        .satellite.s3 { bottom: 22px; right: 4px; animation: counterSpin 30s linear infinite; }

        .orbit-hub {
            position: relative;
            z-index: 2;
            width: 92px;
            height: 92px;
            border-radius: 50%;
            background: rgba(255,255,255,0.95);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 20px 45px -15px rgba(0,0,0,0.5);
        }

        .orbit-hub i { font-size: 32px; color: var(--accent); }

        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes counterSpin { from { transform: rotate(0deg); } to { transform: rotate(-360deg); } }

        .presentation-content {
            position: relative;
            z-index: 1;
            text-align: center;
            max-width: 460px;
        }

        .presentation-content .kicker {
            display: block;
            font-size: 12.5px;
            font-weight: 700;
            letter-spacing: 1.2px;
            color: rgba(255,255,255,0.55);
            text-transform: uppercase;
            margin-bottom: 16px;
            opacity: 0;
            animation: fadeIn 0.8s 0.2s ease-out forwards;
        }

        .presentation-content h1 {
            font-size: 28px;
            font-weight: 900;
            color: #ffffff;
            line-height: 1.5;
            margin-bottom: 16px;
            opacity: 0;
            animation: riseIn 0.7s 0.32s ease-out forwards;
        }

        .presentation-content p {
            font-size: 15.5px;
            color: rgba(255,255,255,0.65);
            line-height: 1.85;
            font-weight: 500;
            opacity: 0;
            animation: riseIn 0.7s 0.42s ease-out forwards;
        }

        @keyframes riseIn {
            from { opacity: 0; transform: translateY(14px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
            }
        }

        .form-group input {
            outline: none;
        }

        .btn-submit:focus-visible,
        .btn-back:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 3px;
        }

        @media (max-width: 900px) {
            .split-layout { flex-direction: column; }
            .presentation-side { width: 100%; min-height: 42vh; padding: 50px 24px; }
            .form-side { width: 100%; padding: 0 24px 50px; margin-top: -28px; }
            .form-inner { background: var(--card); border-radius: 22px; padding: 36px 26px; box-shadow: 0 20px 45px -20px rgba(18,23,43,0.16); max-width: 460px; }
            .orbit-wrap { width: 220px; height: 220px; margin-bottom: 30px; }
            .satellite { width: 42px; height: 42px; font-size: 14px; }
            .orbit-hub { width: 76px; height: 76px; }
            .orbit-hub i { font-size: 26px; }
            .presentation-content h1 { font-size: 23px; }
        }
    </style>
</head>
<body>

    <div class="split-layout">
        <div class="form-side">
            <div class="form-inner">
                <div class="brand-header">
                    <div class="badge"><i class="fa-solid fa-user-shield"></i> الوصول الآمن</div>
                    <h2 id="districtTitle">جاري جلب اسم المقاطعة...</h2>
                </div>

                <form id="loginForm" onsubmit="handleLogin(event)">
                    <div class="form-group">
                        <label for="username">اسم المستخدم</label>
                        <div class="input-container">
                            <i class="fa-solid fa-user input-icon"></i>
                            <input type="text" id="username" placeholder="أدخل اسم المستخدم" required autocomplete="username">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="password">كلمة المرور</label>
                        <div class="input-container">
                            <i class="fa-solid fa-lock input-icon"></i>
                            <input type="password" id="password" placeholder="أدخل كلمة المرور" required autocomplete="current-password">
                        </div>
                    </div>

                    <button type="submit" id="submitBtn" class="btn-submit">
                        <span>تسجيل الدخول</span>
                        <i class="fa-solid fa-arrow-left"></i>
                    </button>

                    <button type="button" class="btn-back" onclick="goBackHome()">
                        <i class="fa-solid fa-arrow-right"></i>
                        <span>العودة لاختيار المقاطعة</span>
                    </button>
                </form>

                <div class="contact-footer" id="footerText">جميع الحقوق محفوظة © النظام الرقمي</div>
            </div>
        </div>

        <div class="presentation-side">
            <div class="orbit-wrap">
                <div class="orbit-track"></div>
                <div class="orbit-ring">
                    <div class="satellite s1"><i class="fa-solid fa-chalkboard-user"></i></div>
                    <div class="satellite s2"><i class="fa-solid fa-user-tie"></i></div>
                    <div class="satellite s3"><i class="fa-solid fa-magnifying-glass"></i></div>
                </div>
                <div class="orbit-hub"><i class="fa-solid fa-shield-halved"></i></div>
            </div>

            <div class="presentation-content">
                <span class="kicker">منظومة رقمية موحّدة</span>
                <h1>بوابة الدخول الآمن</h1>
                <p>يرجى إدخال بيانات الاعتماد الخاصة بك للوصول إلى لوحة التحكم وإدارة الملفات بصلاحياتك المحددة.</p>
            </div>
        </div>
    </div>

<script>
    const MAIN_PORTAL_URL = "https://script.google.com/macros/s/AKfycbxpMWiDgT8pgT_jkdDmP9mwfLZD1Wkaz63jWZAxy8iyk5maJNZCzZnQp3eS4jPEBIjshQ/exec";

    const districtName = localStorage.getItem("currentDistrictName");
    let targetScriptUrl = "";

    if (!districtName) {
        alert("يرجى اختيار المقاطعة أولاً.");
        window.location.href = "index.html";
    }

    document.getElementById('districtTitle').textContent = districtName;
    document.getElementById('footerText').textContent = "جميع الحقوق محفوظة © " + districtName;

    function goBackHome() {
        window.location.href = "index.html";
    }

    async function loadDistrictUrl() {
        try {
            const response = await fetch(`${MAIN_PORTAL_URL}?action=getScriptUrl&district=${encodeURIComponent(districtName)}`);
            const result = await response.json();

            if (result.status === "success" && result.scriptUrl) {
                targetScriptUrl = result.scriptUrl;
                localStorage.setItem("currentScriptUrl", targetScriptUrl);
            }
        } catch (error) {
            console.error(error);
        }
    }

    window.addEventListener('DOMContentLoaded', () => {
        loadDistrictUrl();
    });

    async function handleLogin(e) {
        e.preventDefault();
        
        if (!targetScriptUrl) {
            targetScriptUrl = localStorage.getItem("currentScriptUrl");
        }

        if (!targetScriptUrl) {
            return alert("تعذر جلب رابط المقاطعة، يرجى المحاولة مرة أخرى.");
        }

        const submitBtn = document.getElementById('submitBtn');
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span>جاري التحقق...</span><i class="fa-solid fa-spinner fa-spin"></i>';

        const data = {
            action: "login",
            username: document.getElementById('username').value.trim(),
            password: document.getElementById('password').value.trim()
        };

        try {
            const response = await fetch(targetScriptUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(data)
            });
            
            const result = await response.json();
            
            if (result.status === "success") {
                const cleanRole = (result.user.role || "").toString().trim().toLowerCase();
                result.user.role = cleanRole;
                localStorage.setItem("userSession", JSON.stringify(result.user));
                
                if (cleanRole === "admin") {
                    window.location.href = "dashboard-admin.html";
                } else if (cleanRole === "director") {
                    window.location.href = "dashboard-director.html";
                } else if (cleanRole === "inspector") {
                    window.location.href = "dashboard-inspector.html";
                } else if (cleanRole === "teacher") {
                    window.location.href = "dashboard-teacher.html";
                } else {
                    alert("تم الدخول، لكن الصلاحية غير معروفة: " + cleanRole);
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '<span>تسجيل الدخول</span><i class="fa-solid fa-arrow-left"></i>';
                }
            } else {
                alert(result.message || "اسم المستخدم أو كلمة المرور غير صحيحة.");
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<span>تسجيل الدخول</span><i class="fa-solid fa-arrow-left"></i>';
            }
        } catch (error) {
            alert("حدث خطأ أثناء إرسال بيانات الدخول إلى الخادم.");
            submitBtn.disabled = false;
            submitBtn.innerHTML = '<span>تسجيل الدخول</span><i class="fa-solid fa-arrow-left"></i>';
        }
    }
</script>
</body>
</html>
