<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - النظام الرقمي لمتابعة الوضعية الإدارية للأساتذة</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * { box-sizing: border-box; font-family: 'Tajawal', sans-serif; margin: 0; padding: 0; }

        body {
            min-height: 100vh;
            display: flex;
            background-color: #f8fafc;
            color: #0f172a;
            overflow-x: hidden;
        }

        .split-layout { display: flex; width: 100%; min-height: 100vh; }

        .form-side {
            width: 45%;
            background: #ffffff;
            padding: 5% 8%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
            z-index: 10;
            box-shadow: -15px 0 40px rgba(0, 0, 0, 0.04);
        }

        .presentation-side {
            width: 55%;
            position: relative;
            background: linear-gradient(135deg, #e0e7ff 0%, #f0fdfa 100%);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .floating-shape {
            position: absolute;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.1) 0%, rgba(16, 185, 129, 0.1) 100%);
            animation: drift 15s infinite alternate ease-in-out;
        }

        .shape-a { width: 600px; height: 600px; top: -10%; right: -20%; }
        .shape-b { width: 450px; height: 450px; bottom: -15%; left: 5%; animation-delay: -5s; animation-duration: 20s; }

        @keyframes drift {
            0% { transform: translateY(0) rotate(0deg) scale(1); }
            100% { transform: translateY(60px) rotate(45deg) scale(1.05); }
        }

        .presentation-content {
            z-index: 1; text-align: center; padding: 40px;
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border-radius: 30px; border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.05); max-width: 85%;
            animation: floatingPanel 6s ease-in-out infinite;
        }

        @keyframes floatingPanel {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        .presentation-icon {
            font-size: 80px;
            background: linear-gradient(135deg, #3b82f6, #10b981);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            margin-bottom: 25px; display: inline-block;
            filter: drop-shadow(0 10px 15px rgba(59, 130, 246, 0.2));
        }

        .presentation-content h1 { font-size: 34px; font-weight: 900; color: #1e293b; margin-bottom: 15px; line-height: 1.4; }
        .presentation-content p { font-size: 18px; color: #475569; max-width: 480px; margin: 0 auto; line-height: 1.6; font-weight: 500; }

        .brand-header { margin-bottom: 50px; opacity: 0; animation: slideInRight 0.8s ease-out forwards; }
        .brand-badge {
            display: inline-flex; align-items: center; gap: 10px; padding: 10px 20px;
            background: #f0f9ff; color: #0284c7; border-radius: 50px; font-weight: 800; font-size: 14px; margin-bottom: 25px; border: 1px solid #e0f2fe;
        }
        .brand-header h2 { font-size: 28px; font-weight: 900; line-height: 1.4; color: #0f172a; }

        #loginForm { display: flex; flex-direction: column; }
        .form-group { margin-bottom: 30px; opacity: 0; transform: translateX(30px); animation: slideInRight 0.8s ease-out forwards; }
        .form-group:nth-child(1) { animation-delay: 0.15s; }
        .form-group:nth-child(2) { animation-delay: 0.3s; }

        .form-group label { display: block; font-size: 15px; font-weight: 800; color: #64748b; margin-bottom: 12px; transition: color 0.3s, transform 0.3s; }
        .form-group:focus-within label { color: #3b82f6; transform: translateX(-5px); }

        .input-container { position: relative; }
        .input-icon { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: #cbd5e1; font-size: 18px; pointer-events: none; transition: color 0.3s; }
        .form-group:focus-within .input-icon { color: #3b82f6; }

        .form-group input {
            width: 100%; padding: 15px 0 15px 40px; border: none; border-bottom: 2px solid #e2e8f0;
            background: transparent; font-size: 16px; color: #0f172a; outline: none; font-weight: 700; transition: all 0.3s;
        }

        .line-indicator { position: absolute; bottom: 0; right: 0; height: 2px; width: 0; background: linear-gradient(90deg, #3b82f6, #10b981); transition: width 0.5s; }
        .form-group:focus-within .line-indicator { width: 100%; }

        .btn-submit {
            width: 100%; background: #3b82f6; color: #ffffff; border: none; padding: 18px; border-radius: 16px;
            font-size: 17px; font-weight: 800; cursor: pointer; display: flex; justify-content: space-between; align-items: center;
            margin-top: 10px; opacity: 0; animation: slideInRight 0.8s 0.45s ease-out forwards; transition: all 0.4s; box-shadow: 0 10px 20px -5px rgba(59, 130, 246, 0.3);
        }
        .btn-submit i { background: rgba(255, 255, 255, 0.25); width: 40px; height: 40px; display: flex; justify-content: center; align-items: center; border-radius: 12px; }
        .btn-submit:hover:not(:disabled) { background: #2563eb; transform: translateY(-3px); }

        .btn-back {
            width: 100%; background: transparent; color: #64748b; border: 2px solid #e2e8f0; padding: 16px;
            border-radius: 16px; font-size: 15px; font-weight: 800; cursor: pointer; display: flex; justify-content: center; align-items: center;
            gap: 12px; margin-top: 15px; opacity: 0; animation: slideInRight 0.8s 0.55s ease-out forwards; transition: all 0.3s;
        }
        .btn-back:hover { background: #f1f5f9; color: #3b82f6; border-color: #cbd5e1; }

        .contact-footer { margin-top: auto; padding-top: 35px; font-size: 13px; color: #94a3b8; font-weight: 600; text-align: center; }

        @keyframes slideInRight {
            from { opacity: 0; transform: translateX(40px); }
            to { opacity: 1; transform: translateX(0); }
        }

        @media (max-width: 900px) {
            .split-layout { flex-direction: column; }
            .presentation-side { width: 100%; min-height: 40vh; }
            .form-side { width: 100%; padding: 45px 30px; border-radius: 35px 35px 0 0; margin-top: -35px; }
        }
    </style>
</head>
<body>

    <div class="split-layout">
        <div class="form-side">
            <div class="brand-header">
                <div class="brand-badge"><i class="fa-solid fa-user-shield"></i> الوصول الآمن</div>
                <h2 id="districtTitle">جاري جلب اسم المقاطعة...</h2>
            </div>

            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="username">اسم المستخدم</label>
                    <div class="input-container">
                        <i class="fa-solid fa-user input-icon"></i>
                        <input type="text" id="username" placeholder="أدخل اسم المستخدم" required autocomplete="username">
                        <div class="line-indicator"></div>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="password">كلمة المرور</label>
                    <div class="input-container">
                        <i class="fa-solid fa-lock input-icon"></i>
                        <input type="password" id="password" placeholder="أدخل كلمة المرور" required autocomplete="current-password">
                        <div class="line-indicator"></div>
                    </div>
                </div>

                <button type="submit" id="submitBtn" class="btn-submit">
                    <span>تسجيل الدخول</span>
                    <i class="fa-solid fa-arrow-left"></i>
                </button>
                
                <button type="button" class="btn-back" onclick="goBackHome()">
                    <i class="fa-solid fa-arrow-right"></i>
                    <span>العودة لاختيار المقاطعة</span>
                </button>
            </form>

            <div class="contact-footer" id="footerText">جميع الحقوق محفوظة © النظام الرقمي</div>
        </div>

        <div class="presentation-side">
            <div class="floating-shape shape-a"></div>
            <div class="floating-shape shape-b"></div>
            
            <div class="presentation-content">
                <i class="fa-solid fa-shield-halved presentation-icon"></i>
                <h1>بوابة الدخول الآمن</h1>
                <p>يرجى إدخال بيانات الاعتماد الخاصة بك للوصول إلى لوحة التحكم وإدارة الملفات البيداغوجية بصلاحياتك المحددة.</p>
            </div>
        </div>
    </div>

<script>
    const MAIN_PORTAL_URL = "https://script.google.com/macros/s/AKfycbxpMWiDgT8pgT_jkdDmP9mwfLZD1Wkaz63jWZAxy8iyk5maJNZCzZnQp3eS4jPEBIjshQ/exec";

    const districtName = localStorage.getItem("currentDistrictName");
    let targetScriptUrl = "";

    if (!districtName) {
        alert("يرجى اختيار المقاطعة أولاً.");
        window.location.href = "index.html";
    }

    document.getElementById('districtTitle').textContent = districtName;
    document.getElementById('footerText').textContent = "جميع الحقوق محفوظة © " + districtName;

    function goBackHome() {
        window.location.href = "index.html";
    }

    async function loadDistrictUrl() {
        try {
            const response = await fetch(`${MAIN_PORTAL_URL}?action=getScriptUrl&district=${encodeURIComponent(districtName)}`);
            const result = await response.json();

            if (result.status === "success" && result.scriptUrl) {
                targetScriptUrl = result.scriptUrl;
                localStorage.setItem("currentScriptUrl", targetScriptUrl);
            }
        } catch (error) {
            console.error(error);
        }
    }

    window.addEventListener('DOMContentLoaded', () => {
        loadDistrictUrl();
    });

    async function handleLogin(e) {
        e.preventDefault();
        
        if (!targetScriptUrl) {
            targetScriptUrl = localStorage.getItem("currentScriptUrl");
        }

        if (!targetScriptUrl) {
            return alert("تعذر جلب رابط المقاطعة، يرجى المحاولة مرة أخرى.");
        }

        const submitBtn = document.getElementById('submitBtn');
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span>جاري التحقق...</span><i class="fa-solid fa-spinner fa-spin"></i>';

        const data = {
            action: "login",
            username: document.getElementById('username').value.trim(),
            password: document.getElementById('password').value.trim()
        };

        try {
            const response = await fetch(targetScriptUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(data)
            });
            
            const result = await response.json();
            
            if (result.status === "success") {
                const cleanRole = (result.user.role || "").toString().trim().toLowerCase();
                result.user.role = cleanRole;
                localStorage.setItem("userSession", JSON.stringify(result.user));
                
                if (cleanRole === "admin") {
                    window.location.href = "dashboard-admin.html";
                } else if (cleanRole === "director") {
                    window.location.href = "dashboard-director.html";
                } else if (cleanRole === "inspector") {
                    window.location.href = "dashboard-inspector.html";
                } else if (cleanRole === "teacher") {
                    window.location.href = "dashboard-teacher.html";
                } else {
                    alert("تم الدخول، لكن الصلاحية غير معروفة: " + cleanRole);
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '<span>تسجيل الدخول</span><i class="fa-solid fa-arrow-left"></i>';
                }
            } else {
                alert(result.message || "اسم المستخدم أو كلمة المرور غير صحيحة.");
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<span>تسجيل الدخول</span><i class="fa-solid fa-arrow-left"></i>';
            }
        } catch (error) {
            alert("حدث خطأ أثناء إرسال بيانات الدخول إلى الخادم.");
            submitBtn.disabled = false;
            submitBtn.innerHTML = '<span>تسجيل الدخول</span><i class="fa-solid fa-arrow-left"></i>';
        }
    }
</script>
</body>
</html>
